<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <script src="test.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div id="bookDisplay">
        
    </div>

    <button id="newBtn" onclick="openForm()">New Book</button>

    <div class="form-popup" id="myForm">
        <form action="/action_page.php" class="form-container" id="bookForm">
            <h1>Book Info</h1>

            <label for="title" ><b>Title</b></label>
            <input id="bookTitle" type="text" placeholder=" Book Name" name="title" required>

            <label for="author" id="authorName"><b>Author</b></label>
            <input id="authorName" type="text" placeholder="Author" name="author" required>

            <label for="pages" ><b>Pages</b></label>
            <input id="numberOfPages" type="number" placeholder="Pages" name="pages" required>

            <input type="checkbox"  name="readStatus" value="false" >
            <label id="readStatus" for="readStatus"><b>Read </b></label>
            
            <button type="submit" class="btn" id="archiveButton">Archive</button>
            <button type="button" class="btn cancel" onclick="closeForm()">Close</button>
        </form>
    </div>

</body>

</html>
